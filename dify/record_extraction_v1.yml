        y: 160
      positionAbsolute:
        x: 990
        y: 160
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        selected: false
        desc: ''
        type: code
        title: 校验 JSON 输出
        code_language: python3
        code: "\"\"\"Shared, dependency-free model view; also embedded in Dify code\
