ge_id","event_kind","summary","evidence"],"additionalProperties":false},"minItems":0},"next_actions":{"type":"array","items":{"type":"object","properties":{"text":{"type":"string","minLength":1},"basis":{"type":"string","enum":["explicit_in_chat","reviewer_suggestion"]},"evidence":{"type":"array","items":{"$ref":"#/$defs/Evidence"},"minItems":0}},"required":["text","basis","evidence"],"additionalProperties":false},"minItems":0},"risk_flags":{"type":"array","items":{"$ref":"#/$defs/RiskFlag"},"minItems":0}},"required":["title","first_question_message_id","first_visible_message_id","date_basis","problem","processing_summary","current_conclusion","proposed_status","status_evidence","claims","timeline_events","next_actions","risk_flags"],"additionalProperties":false},{"type":"null"}]},"qa_candidates":{"type":"array","items":{"type":"object","properties":{"candidate_key":{"type":"string","minLength":1},"action":{"type":"string","enum":["create","propose_revision"]},"existing_qa_id":{"type":["string","null"]},"question":{"type":"string","minLength":1},"answer":{"type":"string","minLength":1},"applicability":{"type":"string","minLength":1},"question_evidence":{"type":"array","items":{"$ref":"#/$defs/Evidence"},"minItems":1},"answer_claims":{"type":"array","items":{"$ref":"#/$defs/Claim"},"minItems":1},"contributors":{"type":"array","items":{"type":"object","properties":{"participant_id":{"type":"string"},"contribution":{"type":"string","minLength":1},"evidence":{"type":"array","items":{"$ref":"#/$defs/Evidence"},"minItems":1}},"required":["participant_id","contribution","evidence"],"additionalProperties":false},"minItems":1},"risk_flags":{"type":"array","items":{"$ref":"#/$defs/RiskFlag"},"minItems":0}},"required":["candidate_key","action","existing_qa_id","question","answer","applicability","question_evidence","answer_claims","contributors","risk_flags"],"additionalProperties":false},"minItems":0},"qa_assessment":{"type":"object","properties":{"eligibility":{"type":"strin