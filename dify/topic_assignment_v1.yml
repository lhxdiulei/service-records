    - id: recheck
      type: custom
      position:
        x: 1920
        y: 160
      positionAbsolute:
        x: 1920
        y: 160
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        selected: false
        desc: ''
        type: code
        title: 再次校验输出
        code_language: python3
        code: "\"\"\"Shared, dependency-free model view; also embedded in Dify code\
          \ nodes.\"\"\"\nimport json\nimport copy\n\nID_FIELDS={'message_id','participant_id','issue_id','existing_issue_id','first_visible_message_id',\n\
          \           'first_question_message_id','occurred_message_id','existing_qa_id','qa_id','ticket_id',\n\
          \           'revision_id','reply_to_message_id'}\nID_LISTS={'main_message_ids','context_message_ids','allowed_message_ids','support_message_ids','source_issue_ids'}\n\
          \n\ndef alias_maps(payload):\n    forward={}\n    def add(value,prefix):\n\
          \        if value and value not in forward:\n            forward[value]=prefix+str(1+sum(v.startswith(prefix)\
          \ for v in forward.values()))\n    for m in payload.get('messages',[]):add(m['message_id'],'m')\n\
          \    for p in payload.get('participants',[]):add(p['participant_id'],'p')\n\
          \    for i in payload.get('candidate_issues',[]):add(i['issue_id'],'i')\n\
          \    if payload.get('issue'):add(payload['issue']['issue_id'],'i')\n   \
          \ if payload.get('current_ticket'):\n        add(payload['current_ticket']['ticket_id'],'t');add(payload['current_ticket']['revision_id'],'r')\n\
          \    for q in payload.get('related_qa',[]):\n        add(q['qa_id'],'q');add(q['revision_id'],'r')\n\
          \    return forward,{v:k for k,v in forward.items()}\n\n\ndef replace_ids(value,mapping,key=''):\n\
          \    if isinstance(value,dict):return {k:replace_ids(v,mapping,k) for k,v\
          \ in value.items()}\n    if isinstance(value,list):return [replace_ids(v,mapping,key)\
          \ for v in value]\n    if isinstance(value,str) and (key in ID_FIELDS or\
          \ key in ID_LISTS):return mapping.get(value,value)\n    return value\n\n\
          \ndef model_view(payload):\n    \"\"\"Only presentation changes: raw text\
          \ and sender identity stay intact.\"\"\"\n    data=copy.deepcopy(payload)\n\
          \    for key in ('run','scope'):data.pop(key,None)\n    used={m['participant_id']\
          \ for m in data['messages']}\n    data['participants']=[p for p in data['participants']\
          \ if p['participant_id'] in used]\n    for m in data['messages']:\n    \
          \    if m.get('body_text')==m['raw_text']:m.pop('body_text')\n        for\
          \ key in ('quoted_text','reply_to_message_id','parse_warnings','has_nontext'):\n\
          \            if not m.get(key):m.pop(key,None)\n        spans=m.get('direct_body_spans',[])\n\
          \        if spans==[{'start':0,'end':len(m['raw_text'])}]:m.pop('direct_body_spans',None)\n\
          \    for c in data.get('candidate_issues',[]):\n        c.pop('version',None);c.pop('message_version',None)\n\
          \        if c.get('summary')==c['title']:c.pop('summary',None)\n       \
          \ c.pop('support_message_ids',None)\n    processing=data.pop('processing',{})\n\
          \    if processing:\n        data['processing']={k:v for k,v in processing.items()\
          \ if k in ('phase','source_parts_complete','source_part_count','reduction_note','risks')}\n\
          \    forward,_=alias_maps(data)\n    return replace_ids(data,forward)\n\n\
          \ndef restore_result(payload,result):\n    _,reverse=alias_maps(model_view_original_participants(payload))\n\
          \    return replace_ids(result,reverse)\n\n\ndef model_view_original_participants(payload):\n\
          \    # Match the participant filtering used in model_view without recursively\n\
          \    # constructing another model view.\n    data=dict(payload)\n    used={m['participant_id']\
          \ for m in payload['messages']}\n    data['participants']=[p for p in payload['participants']\
          \ if p['participant_id'] in used]\n    return data\n\n\ndef model_json(payload):\n\
          \    return json.dumps(model_view(payload),ensure_ascii=False,separators=(',',':'))\n\
          \ndef alias_feedback(payload_json, text):\n    try:\n        forward,_ =\
          \ alias_maps(model_view_original_participants(json.loads(payload_json)))\n\
          \        for original,alias in forward.items():\n            text = text.replace(original,alias)\n\
          \    except Exception:\n        pass\n    return text[:800]\n\nimport json\n\
          \ndef main(raw_text: str, payload_json: str = \"{}\") -> dict:\n    text\
          \ = raw_text.strip()\n    if text.startswith(\"```\"):\n        lines =\
          \ text.splitlines()\n        text = \"\\n\".join(lines[1:-1]) if lines[-1].strip()\
          \ == \"```\" else text\n    try:\n        data = json.loads(text)\n    \
          \    if not isinstance(data, dict) or data.get(\"schema_version\") != \"\
          1.0\":\n            raise ValueError(\"OUTPUT_INVALID\")\n        payload\
          \ = json.loads(payload_json)\n        data = restore_result(payload, data)\n\
          \        allowed = {m[\"message_id\"] for m in payload[\"messages\"]}\n\
          \        if \"main_message_ids\" in payload:\n            main_ids = set(payload[\"\
          main_message_ids\"])\n            candidates = {i[\"issue_id\"] for i in\
          \ payload[\"candidate_issues\"]}\n            assigned = set()\n       \
          \     keys = set()\n            for item in data[\"assignments\"]:\n   \
          \             if item[\"local_topic_key\"] in keys:\n                  \
          \  raise ValueError(\"local_topic_key must be unique\")\n              \
          \  keys.add(item[\"local_topic_key\"])\n                ids = {m[\"message_id\"\
          ] for m in item[\"message_links\"]}\n                if not ids <= allowed:\n\
          \                    raise ValueError(\"Use only input message IDs\")\n\
          \                if item[\"decision\"] == \"link_existing\" and item[\"\
          existing_issue_id\"] not in candidates:\n                    raise ValueError(\"\
          link_existing requires an ID from candidate_issues. With no candidates,\
          \ use new_issue for a clear problem and existing_issue_id=null\")\n    \
          \            if item[\"decision\"] == \"new_issue\" and (item[\"existing_issue_id\"\
          ] is not None or not ids & main_ids):\n                    raise ValueError(\"\
          new_issue requires existing_issue_id=null and main messages\")\n       \
          \         assigned |= ids & main_ids\n            unassigned = {m[\"message_id\"\
          ] for m in data[\"unassigned_messages\"]}\n            missing = main_ids\
          \ - assigned - unassigned\n            if missing:\n                raise\
          \ ValueError(\"Missing main_message_ids: \" + \", \".join(sorted(missing))\
          \ + \". Include each missing message in its matching assignment, including\
          \ support answers\")\n            if not unassigned <= main_ids or assigned\
          \ & unassigned:\n                raise ValueError(\"Unassigned IDs must\
          \ be main messages and cannot also be assigned\")\n        else:\n     \
          \       if (data[\"ticket\"] is None) != (payload[\"mode\"] == \"qa\"):\n\
          \                raise ValueError(\"ticket must be an object in both/ticket\
          \ mode, and null only in qa mode\")\n            eligible = data[\"qa_assessment\"\
          ][\"eligibility\"] == \"eligible\"\n            if bool(data[\"qa_candidates\"\
          ]) != eligible:\n                raise ValueError(\"eligible requires at\
          \ least one complete qa_candidates item; otherwise qa_candidates must be\
          \ empty\")\n            if eligible and not payload[\"issue\"][\"input_complete\"\
          ]:\n                raise ValueError(\"Incomplete input cannot produce eligible\
          \ QA\")\n            if payload[\"mode\"] == \"ticket\" and data[\"qa_assessment\"\
          ][\"eligibility\"] != \"not_requested\":\n                raise ValueError(\"\
          ticket mode requires qa_assessment.eligibility=not_requested\")\n      \
          \      messages = {m[\"message_id\"]: m for m in payload[\"messages\"]}\n\
          \            def evidence(value):\n                if isinstance(value,\
          \ dict):\n                    if \"exact_excerpt\" in value:\n         \
          \               if value[\"message_id\"] not in allowed:\n             \
          \               raise ValueError(\"Evidence message must be from input\"\
          )\n                        raw = messages[value[\"message_id\"]][\"raw_text\"\
          ]\n                        excerpt = value[\"exact_excerpt\"]\n        \
          \                count = sum(raw.startswith(excerpt, i) for i in range(len(raw)))\
          \ if excerpt else 0\n                        if value[\"occurrence\"] <\
          \ 1 or value[\"occurrence\"] > count:\n                            raise\
          \ ValueError(\"Evidence exact_excerpt must occur verbatim in raw_text with\
          \ a valid occurrence\")\n                    for child in value.values():\n\
          \                        evidence(child)\n                elif isinstance(value,\
          \ list):\n                    for child in value:\n                    \
          \    evidence(child)\n            evidence(data)\n        return {\"result_json\"\
          : json.dumps(data, ensure_ascii=False), \"validation_status\": \"valid\"\
          , \"error_code\": \"\", \"feedback\": \"\"}\n    except Exception as exc:\n\
          \        return {\"result_json\": \"\", \"validation_status\": \"invalid\"\
          , \"error_code\": \"OUTPUT_INVALID\", \"feedback\": alias_feedback(payload_json,\
          \ str(exc))}\n"
        variables:
        - variable: raw_text
          value_selector:
          - repair
          - text
        - variable: payload_json
          value_selector:
          - start
          - payload_json
        outputs:
          result_json:
            type: string
            children: null
          validation_status:
            type: string
            children: null
          error_code:
            type: string
            children: null
          feedback:
            type: string
            children: null
