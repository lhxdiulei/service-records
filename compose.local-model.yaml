name: service-records-model
services:
  ollama:
    image: ollama/ollama:0.18.0
    restart: unless-stopped
    gpus: all
    mem_limit: 3g
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_FLASH_ATTENTION: '1'
    volumes:
      - type: bind
        source: ${LOCAL_OLLAMA_MODELS_DIR:-E:/Ollama/models}
        target: /models
        read_only: true
    networks:
      dify:
        aliases: [records-ollama]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  dify:
    external: true
    name: ${LOCAL_DIFY_NETWORK:-dify-local_default}
